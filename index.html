<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dude in the Desert Studios | The Mirage</title>
    <!-- Importing Googie-inspired and retro-terminal fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Vibrant Neon Color Palette */
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ccff00;
            --desert-night: #0a0510;
        }

        body {
            background-color: var(--desert-night);
            color: #fff;
            font-family: 'Space Mono', monospace;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            /* The Glowing Desert Dance Floor Grid */
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.15) 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: center bottom;
            perspective: 1000px;
        }

        /* The Mirage Effect */
        .mirage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            /* Subtle pulsing blur to simulate heat waves / a mirage */
            animation: heatwave 4s infinite alternate ease-in-out;
        }

        @keyframes heatwave {
            0% { filter: drop-shadow(0 0 10px var(--neon-pink)) blur(0.5px); }
            100% { filter: drop-shadow(0 0 35px var(--neon-cyan)) blur(0px); }
        }

        /* Mid-Century Googie Signage Structure */
        .googie-sign {
            border: 4px solid var(--neon-pink);
            border-radius: 60px 0 60px 0; /* Asymmetrical geometric structure */
            padding: 50px 40px;
            background: rgba(10, 5, 16, 0.85);
            box-shadow: 
                inset 0 0 20px var(--neon-pink),
                0 0 30px var(--neon-pink);
            position: relative;
            transform: skew(-4deg);
            max-width: 700px;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-family: 'Righteous', cursive;
            font-size: 4.5rem;
            color: var(--neon-yellow);
            text-shadow: 3px 3px 0px var(--neon-pink), 6px 6px 15px var(--neon-cyan);
            margin: 0 0 20px 0;
            text-transform: uppercase;
            line-height: 1.1;
        }

        p {
            font-size: 1.2rem;
            color: var(--neon-cyan);
            line-height: 1.6;
            text-shadow: 0 0 8px var(--neon-cyan);
            margin-bottom: 30px;
        }

        .access-button {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: 'Space Mono', monospace;
            font-weight: bold;
            color: var(--desert-night);
            background-color: var(--neon-yellow);
            border: 2px solid var(--neon-yellow);
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--neon-yellow);
            text-transform: uppercase;
            transition: all 0.3s ease;
            transform: skew(4deg); /* Counter-skew to the sign */
        }

        .access-button:hover {
            background-color: transparent;
            color: var(--neon-pink);
            border-color: var(--neon-pink);
            box-shadow: 0 0 30px var(--neon-pink), inset 0 0 15px var(--neon-pink);
        }
    </style>
</head>
<body>
    <div class="mirage-container">
        <div class="googie-sign">
            <h1>Dude in the Desert</h1>
            <p>You've wandered far enough. The grid ends here.</p>
            <p>Welcome to the oasis. Mid-century lines, neon nights, and a dance floor glowing under the isolation of a surreal sky. Only those who seek the mirage can step inside.</p>
		<a href="gallery.html" class="access-button" style="text-decoration: none; display: inline-block; margin-top: 15px;">Enter the Void</a>        </div>
    </div>
</body>
</html>
